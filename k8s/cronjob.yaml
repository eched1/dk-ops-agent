apiVersion: batch/v1
kind: CronJob
metadata:
  name: dk-ops-agent
  namespace: logsight
spec:
  schedule: "0 7 * * 1-5"  # 7 AM CT, Mon-Fri
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ops-agent
              image: dk-ops-agent:latest
              imagePullPolicy: Never
              command: ["python3", "agent.py", "--mode", "daily-briefing", "-v"]
              env:
                - name: MCP_BASE_URL
                  value: "https://dk-infraedge-mcp.example.internal"
                - name: MCP_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dk-ops-agent-secrets
                      key: MCP_AUTH_TOKEN
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: logsight-secrets
                      key: OPENAI_API_KEY
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: dk-ops-agent-secrets
                      key: SLACK_WEBHOOK_URL
                      optional: true
          restartPolicy: OnFailure
